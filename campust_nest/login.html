<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusNest Freetown</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-container {
            max-width: 460px;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .auth-container h1 {
            color: var(--primary-teal);
            margin-bottom: 10px;
        }

        .auth-container > p {
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .auth-container input,
        .auth-container select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dfdd;
            border-radius: 7px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .auth-container .form-group {
            margin-bottom: 20px;
        }

        .auth-container .btn-teal {
            width: 100%;
            border: none;
            cursor: pointer;
            padding: 14px;
        }

        .auth-message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        @media (max-width: 600px) {
            .auth-container {
                margin: 30px 16px;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<header class="main-header">
    <div class="logo">CampusNest <span>Freetown</span></div>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="rooms.html">Find a Room</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <section class="auth-container">

        <h1>Welcome Back</h1>

        <p>Log in to your CampusNest account.</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="role">Account Type</label>

                <select id="role" name="role" required>
                    <option value="">Select account type</option>
                    <option value="student">Student / Tenant</option>
                    <option value="landlord">Landlord / Property Owner</option>
                </select>
            </div>

            <button type="submit" class="btn-teal">
                Log In
            </button>

            <div
                id="loginMessage"
                class="auth-message"
                role="status"
                aria-live="polite">
            </div>

        </form>

        <p style="margin-top: 25px; margin-bottom: 0;">
            Don't have an account?

            <a
                href="register.html"
                style="color: var(--primary-teal); font-weight: 600;">
                Register here
            </a>
        </p>

        <p style="margin-top: 15px; margin-bottom: 0;">
            <a
                href="index.html"
                style="color: var(--primary-teal);">
                &larr; Back to Home
            </a>
        </p>

    </section>
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("loginMessage");

    loginForm.addEventListener("submit", function (event) {

        // Prevent the page from refreshing.
        event.preventDefault();

        const email = document.getElementById("email")
            .value.trim().toLowerCase();

        const password = document.getElementById("password").value;

        const role = document.getElementById("role").value;

        message.style.display = "block";

        // Read registered accounts from browser storage.
        let users;

        try {
            users = JSON.parse(
                localStorage.getItem("campusnestUsers") || "[]"
            );

            if (!Array.isArray(users)) {
                users = [];
            }

        } catch (error) {
            message.style.background = "#fde8e8";
            message.style.color = "#b91c1c";
            message.textContent =
                "There is a problem reading your saved accounts.";
            return;
        }

        // Find an account matching all three login details.
        const user = users.find(function (account) {
            return (
                account.email &&
                account.email.trim().toLowerCase() === email &&
                account.password === password &&
                account.role === role
            );
        });

        // Show an error if the details do not match.
        if (!user) {

            message.style.background = "#fde8e8";
            message.style.color = "#b91c1c";

            message.textContent =
                "Login failed. Check your email, password, and account type. If you have not registered on this browser, please register first.";

            return;
        }

        // Save the current user's profile without their password.
        localStorage.setItem(
            "campusnestCurrentUser",
            JSON.stringify({
                fullName: user.fullName,
                email: user.email,
                role: user.role,
                phone: user.phone,
                institution: user.institution
            })
        );

        message.style.background = "#d1fae5";
        message.style.color = "#065f46";
        message.textContent = "Login successful! Redirecting...";

        // Redirect according to the account type.
        setTimeout(function () {

            if (user.role === "landlord") {
                window.location.href = "list-room.html";
            } else {
                window.location.href = "rooms.html";
            }

        }, 1000);

    });

});
</script>

</body>
</html>
