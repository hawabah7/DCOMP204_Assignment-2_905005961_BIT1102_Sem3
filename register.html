<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | CampusNest Freetown</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .register-container {
            max-width: 550px;
            margin: 50px auto;
            padding: 35px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .register-container h1 {
            color: var(--primary-teal);
            margin-bottom: 10px;
        }

        .register-intro {
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .register-container .form-group {
            margin-bottom: 20px;
        }

        .register-container input,
        .register-container select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dfdd;
            border-radius: 7px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .register-container .btn-teal {
            width: 100%;
            padding: 14px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .register-message {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 7px;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .register-container {
                margin: 25px 15px;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<header class="main-header">

    <div class="logo">
        CampusNest <span>Freetown</span>
    </div>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="rooms.html">Find a Room</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>

<main>

    <section class="register-container">

        <h1>Create Your Account</h1>

        <p class="register-intro">
            Join CampusNest Freetown to find student accommodation
            or list your property.
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="fullName">Full Name *</label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+232..."
                    autocomplete="tel"
                    required
                >
            </div>

            <div class="form-group">
                <label for="accountType">Account Type *</label>

                <select id="accountType" name="accountType" required>
                    <option value="">Select account type</option>
                    <option value="student">Student / Tenant</option>
                    <option value="landlord">Landlord / Property Owner</option>
                </select>
            </div>

            <div class="form-group" id="institutionGroup">
                <label for="institution">University / Institution</label>

                <select id="institution" name="institution">
                    <option value="">Select your institution</option>
                    <option value="Fourah Bay College">Fourah Bay College</option>
                    <option value="IPAM">IPAM</option>
                    <option value="COMAHS">COMAHS</option>
                    <option value="Limkokwing University">
                        Limkokwing University
                    </option>
                    <option value="Milton Margai Technical University">
                        Milton Margai Technical University
                    </option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password *</label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Enter your password again"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" class="btn-teal">
                Create Account
            </button>

            <div
                id="registerMessage"
                class="register-message"
                role="status"
                aria-live="polite">
            </div>

        </form>

        <p style="margin-top: 25px;">
            Already have an account?
            <a
                href="login.html"
                style="color: var(--primary-teal); font-weight: 600;">
                Log In
            </a>
        </p>

        <p>
            <a href="index.html" style="color: var(--primary-teal);">
                &larr; Back to Home
            </a>
        </p>

    </section>
```html
<script>
const accountType = document.getElementById("accountType");
const institution = document.getElementById("institution");
const institutionGroup = document.getElementById("institutionGroup");

function updateInstitutionField() {
    const isStudent = accountType.value === "student";

    institutionGroup.style.display = isStudent ? "block" : "none";
    institution.required = isStudent;

    if (!isStudent) {
        institution.value = "";
    }
}

accountType.addEventListener("change", updateInstitutionField);
updateInstitutionField();

document.getElementById("registerForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const phone = document.getElementById("phone").value.trim();
    const role = accountType.value;
    const school = institution.value;
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("registerMessage");

    message.style.display = "block";

    if (password !== confirmPassword) {
        message.style.background = "#fde8e8";
        message.style.color = "#b91c1c";
        message.textContent = "Your passwords do not match.";
        return;
    }

    if (password.length < 8) {
        message.style.background = "#fde8e8";
        message.style.color = "#b91c1c";
        message.textContent = "Your password must contain at least 8 characters.";
        return;
    }

    let users = JSON.parse(localStorage.getItem("campusnestUsers") || "[]");

    const existingUser = users.find(user => user.email === email);

    if (existingUser) {
        message.style.background = "#fde8e8";
        message.style.color = "#b91c1c";
        message.textContent = "An account with this email already exists. Please log in.";
        return;
    }

    const newUser = {
        fullName: fullName,
        email: email,
        phone: phone,
        role: role,
        institution: school,
        password: password
    };

    users.push(newUser);

    localStorage.setItem("campusnestUsers", JSON.stringify(users));

    message.style.background = "#d1fae5";
    message.style.color = "#065f46";
    message.textContent = "Registration successful! Redirecting to login...";

    setTimeout(function() {
        window.location.href = "login.html";
    }, 1500);
});
</script>


</main>



</body>
</html>
